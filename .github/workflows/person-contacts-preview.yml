# Preview-only workflow for the person contacts prototype. Lives on the
# preview/person-contacts branch of a fork; never part of an upstream PR.
name: Person contacts preview
'on':
  workflow_dispatch:
  push:
    branches:
    - preview/person-contacts
permissions:
  contents: write
jobs:
  generate-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: macrodb
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://user:password@localhost:5432/macrodb
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /
    - uses: DeterminateSystems/nix-installer-action@v16
    - name: Enter Nix dev shell
      uses: ./.github/actions/setup-nix-dev-shell
    - name: Install web dependencies
      run: bun install --frozen-lockfile
    - name: Migrate MacroDB
      run: just crates/macro_db_client/migrate_db
    - name: Refresh the SQLx cache
      run: just prepare_db
    - name: Regenerate the storage API client
      working-directory: apps/web
      run: bun run gen-api cloud-storage
    - name: Regenerate GraphQL types
      working-directory: apps/web
      run: bun run gen-graphql
    - name: Save generated changes
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/results"
        git add -A ':!.github/workflows/person-contacts-preview.yml'
        git diff --cached --stat > "$RUNNER_TEMP/results/generated.stat" || true
        git diff --cached > "$RUNNER_TEMP/results/generated.patch" || true
    - name: Type-check web
      id: typecheck
      continue-on-error: true
      working-directory: apps/web
      run: bun run type-check 2>&1 | tee "$RUNNER_TEMP/results/type-check.log"; exit ${PIPESTATUS[0]}
    - name: Biome on changed web files
      id: biome
      continue-on-error: true
      run: |
        files=$(git diff --name-only 7d0b1af3be63603d94d2ffda73e971e1e345a2a6 -- 'apps/web/src/**.ts' 'apps/web/src/**.tsx' | grep -v '/generated/' || true)
        biome check $files 2>&1 | tee "$RUNNER_TEMP/results/biome.log"; exit ${PIPESTATUS[0]}
    - name: Web unit tests for CRM
      id: vitest
      continue-on-error: true
      working-directory: apps/web
      run: bunx vitest run src/features/crm 2>&1 | tail -80 | tee "$RUNNER_TEMP/results/vitest.log"; exit ${PIPESTATUS[0]}
    - name: Publish results
      if: always()
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        cd "$RUNNER_TEMP/results"
        {
          echo "run: $RUN_URL"
          echo "commit: $GITHUB_SHA"
          echo "type-check: ${{ steps.typecheck.outcome }}"
          echo "biome: ${{ steps.biome.outcome }}"
          echo "vitest: ${{ steps.vitest.outcome }}"
        } > summary.txt
        git init -q -b preview-results
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        git add -A && git commit -qm "Results for $GITHUB_SHA"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/preview/person-contacts-results
