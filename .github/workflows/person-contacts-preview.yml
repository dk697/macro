# Preview-only workflow for the person contacts prototype. Lives on the
# preview/person-contacts branch of a fork; never part of an upstream PR.
name: Person contacts preview
'on':
  workflow_dispatch:
  push:
    branches:
    - preview/person-contacts
permissions:
  contents: write
jobs:
  generate-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: macrodb
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d macrodb" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://user:password@localhost:5432/macrodb
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 12
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /
    - uses: DeterminateSystems/nix-installer-action@v16
    - name: Enter Nix dev shell
      uses: ./.github/actions/setup-nix-dev-shell
    - name: Install web dependencies
      run: bun install --frozen-lockfile
    - name: Migrate MacroDB
      run: just crates/macro_db_client/migrate_db
    - name: Refresh the SQLx cache
      run: just prepare_db
    - name: Regenerate the storage API client
      working-directory: apps/web
      run: bun run gen-api cloud-storage
    - name: Regenerate GraphQL types
      working-directory: apps/web
      run: bun run gen-graphql
    - name: Save generated changes
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/results"
        git add -A ':!.github/workflows/person-contacts-preview.yml'
        git diff --cached --stat > "$RUNNER_TEMP/results/generated.stat" || true
        git diff --cached > "$RUNNER_TEMP/results/generated.patch" || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: generated
        path: ${{ runner.temp }}/results/generated.patch
    - name: Type-check web
      id: typecheck
      continue-on-error: true
      working-directory: apps/web
      run: bun run type-check 2>&1 | tee "$RUNNER_TEMP/results/type-check.log"; exit ${PIPESTATUS[0]}
    - name: Biome on changed web files
      id: biome
      continue-on-error: true
      run: |
        files=$(env -u LD_LIBRARY_PATH /usr/bin/git diff --name-only 7d0b1af3be63603d94d2ffda73e971e1e345a2a6 HEAD -- apps/web/src apps/web/tests | grep -E '\.tsx?$' | grep -v '/generated/')
        echo "$files"
        test -n "$files"
        biome check $files 2>&1 | tee "$RUNNER_TEMP/results/biome.log"; exit ${PIPESTATUS[0]}
    - name: Web unit tests for CRM
      id: vitest
      continue-on-error: true
      working-directory: apps/web
      run: bunx vitest run src/features/crm 2>&1 | tail -80 | tee "$RUNNER_TEMP/results/vitest.log"; exit ${PIPESTATUS[0]}
    - name: Publish results
      if: always()
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        cd "$RUNNER_TEMP/results"
        {
          echo "run: $RUN_URL"
          echo "commit: $GITHUB_SHA"
          echo "type-check: ${{ steps.typecheck.outcome }}"
          echo "biome: ${{ steps.biome.outcome }}"
          echo "vitest: ${{ steps.vitest.outcome }}"
        } > summary.txt
        g() { env -u LD_LIBRARY_PATH /usr/bin/git "$@"; }
        g init -q -b preview-results
        g config user.name "github-actions"
        g config user.email "github-actions@users.noreply.github.com"
        g add -A && g commit -qm "Results for $GITHUB_SHA"
        g push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/preview/person-contacts-results
  screenshots:
    needs: generate-and-check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      SQLX_OFFLINE: 'true'
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
    - uses: actions/download-artifact@v4
      with:
        name: generated
        path: ${{ runner.temp }}/generated
    - name: Apply generated files
      run: git apply --allow-empty "$RUNNER_TEMP/generated/generated.patch"
    - uses: DeterminateSystems/nix-installer-action@v16
    - name: Enter Nix dev shell
      uses: ./.github/actions/setup-nix-dev-shell
    - name: Install web dependencies
      run: bun install --frozen-lockfile
    - name: Build WASM packages
      working-directory: apps/web
      run: just build-wasm
    - name: Build the web app with the person contacts harness
      working-directory: apps/web
      run: MODE=development NODE_OPTIONS=--max-old-space-size=12288 bunx vite build -c tests/person-contacts/vite.config.ts
    - name: Install Chromium
      working-directory: apps/web
      run: bunx playwright install --with-deps chromium
    - name: Take screenshots
      id: shots
      continue-on-error: true
      working-directory: apps/web
      env:
        PERSON_CONTACTS_OUT: ${{ runner.temp }}/shots
      run: |
        bunx vite preview -c tests/person-contacts/vite.config.ts --outDir /tmp/person-contacts-dist --base /app --port 3038 > "$RUNNER_TEMP/preview.log" 2>&1 &
        for i in $(seq 1 60); do curl -sf http://127.0.0.1:3038/app/ >/dev/null && break; sleep 1; done
        bun build tests/person-contacts/browser.ts --target=node --packages=external --outfile=node_modules/.person-contacts-browser/browser.mjs
        node node_modules/.person-contacts-browser/browser.mjs
    - name: Publish screenshots
      if: always()
      run: |
        mkdir -p "$RUNNER_TEMP/shots"
        cp "$RUNNER_TEMP/preview.log" "$RUNNER_TEMP/shots/" 2>/dev/null || true
        g() { env -u LD_LIBRARY_PATH /usr/bin/git "$@"; }
        cd "$RUNNER_TEMP"
        g clone -q --depth 1 --branch preview/person-contacts-results "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" results || (mkdir results && cd results && g init -q -b preview-results)
        cd results
        rm -rf shots && cp -r "$RUNNER_TEMP/shots" shots
        echo "screenshots: ${{ steps.shots.outcome }}" >> summary.txt
        g config user.name "github-actions"
        g config user.email "github-actions@users.noreply.github.com"
        g add -A && g commit -qm "Screenshots for $GITHUB_SHA" || true
        g push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/preview/person-contacts-results
